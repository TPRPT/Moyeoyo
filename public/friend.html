<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Moyeoyo 친구 초대</title>

    <!-- AdSense -->
    <script async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6485508614211221"
            crossorigin="anonymous"></script>

    <style>
        * {
          transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          text-align: center;
          padding: 30px 20px;
          background-color: #f4f4f4;
          color: #333;
          line-height: 1.6;
          animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
        h1 {
          color: #0284c7;
          font-size: 26px;
          margin-bottom: 10px;
          animation: slideDown 0.5s ease-out;
        }
        @keyframes slideDown {
          from {
            opacity: 0;
            transform: translateY(-10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .card {
          background: #fff;
          padding: 24px;
          border-radius: 14px;
          box-shadow: 0 3px 12px rgba(0,0,0,0.08);
          max-width: 440px;
          margin: 0 auto;
          animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .desc {
          font-size: 15px;
          color: #555;
          margin-bottom: 20px;
        }
        .btn {
          background-color: #0284c7;
          color: white;
          padding: 12px 24px;
          border-radius: 8px;
          text-decoration: none;
          font-weight: bold;
          font-size: 16px;
          display: inline-block;
          margin-top: 16px;
          transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover {
          background-color: #0369a1;
          transform: translateY(-2px);
          box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn:active {
          transform: translateY(0);
        }
        .ad-container {
          width: 100%;
          margin: 24px 0;
          display: flex;
          justify-content: center;
        }
        .footer-text {
          font-size: 12px;
          color: #777;
          margin-top: 28px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Moyeoyo 친구 초대</h1>

    <p class="desc">
        친구가 공유한 초대 링크입니다.<br>
        앱을 열어 친구 추가를 완료해주세요!
    </p>

    <!-- 광고 -->
    <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-6485508614211221"
             data-ad-slot="6019267996"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>

    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

    <a id="openAppButton" class="btn" href="#">앱으로 이동하기</a>

    <p class="footer-text">
        이 페이지는 Moyeoyo의 공식 친구 초대 페이지입니다.<br>
        광고는 서비스 운영을 위해 제공됩니다.
    </p>
</div>

<script>
    const APP_PACKAGE = "com.moyeoyo.app";
    const HOST = "moyeoyo-57ac0.web.app";

    function getParam(name) {
      return new URL(location.href).searchParams.get(name);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const uid = getParam("uid");
      const btn = document.getElementById("openAppButton");

      if (!uid) {
        btn.style.display = "none";
        const h1 = document.querySelector("h1");
        const desc = document.querySelector(".desc");
        h1.style.opacity = "0";
        desc.style.opacity = "0";
        h1.textContent = "유효하지 않은 초대 링크";
        desc.textContent = "친구 UID 정보가 누락되었습니다.";
        setTimeout(() => {
          h1.style.opacity = "1";
          desc.style.opacity = "1";
        }, 50);
        return;
      }

      // 버튼 눌렀을 때만 앱 실행
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        const deepLink = `android-app://${APP_PACKAGE}/https/${HOST}/friend?uid=${uid}`;
        window.location.href = deepLink;
      });
    });
</script>

</body>
</html>
